name: Zig nightly snapshot check

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      relevancy_platforms:
        description: 'Space-separated target_platform values to run check_patch_relevancy.sh against'
        type: string
        default: 'linux-64 win-64'

permissions:
  contents: read

env:
  RELEVANCY_PLATFORMS: ${{ inputs.relevancy_platforms || 'linux-64 win-64' }}

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for the bump script)
        uses: actions/checkout@v4

      - name: Checkout conda-forge/zig-feedstock@dev
        uses: actions/checkout@v4
        with:
          repository: conda-forge/zig-feedstock
          ref: dev
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for a new zig nightly snapshot
        id: bump
        run: python3 .github/scripts/bump_snapshot.py upstream/recipe/recipe.yaml

      - name: Run patch-relevancy gate
        if: steps.bump.outputs.changed == 'true'
        id: relevancy
        working-directory: upstream
        run: |
          set +e
          {
            echo 'relevancy<<EOF'
            for p in $RELEVANCY_PLATFORMS; do
              echo "### $p"
              bash recipe/ci_support/check_patch_relevancy.sh "$p"
              echo
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Push bump branch to fork and open PR to conda-forge:dev
        if: steps.bump.outputs.changed == 'true'
        working-directory: upstream
        env:
          GH_TOKEN: ${{ secrets.CF_ZIG_PAT }}
        run: |
          git config user.name "zig-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="snapshot/${{ steps.bump.outputs.new_snapshot }}"
          git checkout -b "$BRANCH"
          git commit -am "snapshot: bump to ${{ steps.bump.outputs.new_version }}-dev.${{ steps.bump.outputs.new_snapshot }}"
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/MementoRC/zig-feedstock.git"
          git push fork "$BRANCH"
          gh pr create \
            --repo conda-forge/zig-feedstock \
            --base dev \
            --head "MementoRC:${BRANCH}" \
            --title "[dev] snapshot bump: ${{ steps.bump.outputs.old_snapshot }} -> ${{ steps.bump.outputs.new_snapshot }}" \
            --body "Automated zig nightly snapshot bump.

          - version: ${{ steps.bump.outputs.old_version }} -> ${{ steps.bump.outputs.new_version }}
          - snapshot: ${{ steps.bump.outputs.old_snapshot }} -> ${{ steps.bump.outputs.new_snapshot }}
          - tarball: ${{ steps.bump.outputs.tarball_url }}
          - sha256: ${{ steps.bump.outputs.sha256 }}

          Patch relevancy gate:
          ${{ steps.relevancy.outputs.relevancy }}

          Auto-generated by MementoRC/zig-feedstock's .github/workflows/zig-nightly-snapshot.yml -- verify FAIL/DRIFT/large-OFFSET findings above before merging. Diff is scoped to recipe/recipe.yaml only."
