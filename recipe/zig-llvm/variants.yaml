c_stdlib:
  - if: linux
    then:
      - sysroot
  - if: osx
    then:
      - macosx_deployment_target
  - if: not unix
    then:
      - vs
c_stdlib_version:
  - if: linux and not riscv64
    then:
      - "2.17"
  - if: riscv64
    then:
      - "2.39"
  - if: osx
    then:
      - "11.3"
  - if: not unix
    then:
      - "2022"
c_compiler:
  - if: not unix
    then:
      - vs2017 
