- file: Lld.zig-prefer-shared-libcxx.patch
  selector: unconditional
  purpose: link shared libc++ when available, not static
  symptom: ""
  tested_by: "recipe/testing/test_libcxx_shared.py (recipe.yaml:426-449); skips THREE sub-tests when ppc64le or emulated (:209-211, :354-356, :685-687). MEASURED 2026-09-13: osx-64 and osx-arm64 both 5 passed/2 skipped (shared libc++.1.0.dylib via @rpath); linux-64 3 passed/3 skipped; ppc64le 0 passed/3 skipped (all three guards fire). The :354-356 guard also blocks the link-free structural check at :374-380 that the function docstring declares as All-platforms -- suspected over-reach, unresolved."
  justification: "RECONSTRUCTED 2026-09-13 by git archaeology, NOT stated by the original author - the ppc64le skip in test_libcxx_shared.py was never explained in its own commit. Provenance: is_ppc64le entered the guard at cb67851d (2026-04-13), whose message is entirely about ZIG_GLOBAL_CACHE_DIR and never mentions ppc64le. The SAME commit added recipe/testing/test_zig_toolchain.py carrying the comment 'ppc64le: LLD lacks relocation support -- verify wrapper blocks it', and that same rationale is echoed in recipe.yaml. All three guarded sub-tests link via zig cc's LLD-backed shared-lib path, so the guard was a REAL workaround when written. CAUTION - THE PREMISE HAS SINCE BEEN SUPERSEDED: NOTES.md 1.10 records that 'LLD lacks PPC64 relocations' is refuted, the actual gap was the inline-PLT relocation family emitted because conda-forge injects -fno-plt, and build.sh:140-144 now counters it with -fplt on linux-ppc64le. ppc64le consequently links via LLD and PASSES today. The guard has not been revisited since April and is a strong removal candidate, untested."
  verify: "ablate with macho group; osx-64 + osx-arm64 must be in the ablation - they are the only lanes that exercise the probe (ppc64le skips all three sub-tests)"
  depends_on: "APPLY-TIME: depends on Lld.zig-macho-lld-support. STALE AS OF 2026-09-13: the former REVERSE COMPILE-TIME reason (ppc64le/0003-gcc-linker-comprehensive free-riding on this patch's libcxx_shared import at its lines 307/335) is VOID -- that patch is no longer in this tree, so it is no longer a reason to retain this one. The patch remains DEFENSIBLE on its own osx/windows grounds (see NOTES.md 1.9): conda's LLVM/clang are built against a shared libc++, and without this patch zig would statically bundle its own while linking that shared-libc++ LLVM. An ablation must use THAT rationale, not the dead ppc64le one."
  cost: "osx-arm64 ~18min"
  ref: "recipe/NOTES.md 1.9"
  status: DEFENSIBLE

