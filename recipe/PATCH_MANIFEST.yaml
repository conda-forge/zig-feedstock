# ANCHOR -- what this manifest was scored against.
# Last-verified: 2026-09-29
# zig 0.17.0 | build 23201 | snapshot 2320+1e770dbef | llvm_version 22
#
# Every row was scored against that recipe state. If recipe.yaml moves and this
# anchor does not, the rows are stale and nothing else will say so. Bump the
# anchor in the SAME change that re-scores. A stale anchor makes staleness
# visible; that is the whole point of it.
# (Convention shared with the 0.16 track's own PATCH_MANIFEST.yaml.)

# PATCH_MANIFEST.yaml -- tracked under recipe/, ships with the feedstock.
# 35 rows total: 34 patch rows, one per patch in recipe/recipe.yaml's
# source.patches list (verified both directions against
# ZIG_RECIPE_LLM_REFERENCE.md section 4: 11 unconditional, 9 if:linux
# common, 2 if:linux ppc64le-group, 12 if:not unix), plus 1 non-patch row
# (its `file:` value ends "(NOT A PATCH)") covering a build.sh lever that
# carries the same retire-or-keep question (convention shared with the
# 0.16 track's own PATCH_MANIFEST.yaml).
#
# selector: one of unconditional | linux | linux-ppc64le | not-unix, matching
#           which of the four `patches:` groups in recipe.yaml the row's file
#           sits in. The linux-ppc64le group is itself gated `if: linux` (any
#           linux variant, not `linux and ppc64le`) in recipe.yaml -- see
#           recipe/NOTES.md 1.10 for why -- "linux-ppc64le" here names the
#           group by its content, not its literal recipe.yaml selector.
#
# symptom:       VERBATIM text copied from a source read for this manifest
#                (recipe.yaml comment, recipe/NOTES.md, ZIG_RECIPE_LLM_REFERENCE.md,
#                or a test file's own docstring/assertion). An empty symptom
#                means nobody can retire this row yet -- that is a correct,
#                useful answer, not a gap to be filled by inference.
# tested_by:     a test in the recipe that exercises this patch. A tested patch
#                is DEFENDED: the test is the symptom encoded executably and
#                re-checks every lane it runs on.
# justification: EXTERNAL-CONDITION = a checkable state of the world (retirable
#                by reading, e.g. a conda-forge glibc floor).
#                OBSERVED-FAILURE   = a crash/miscompile/link failure actually
#                                     recorded somewhere (retirable only by
#                                     ablation).
#                UNRECORDED         = neither found. Unfalsifiable until ablated.
# verify:        the check that would show this patch is no longer needed.
# depends_on:    another ablation unit (patch or patch group) whose retirement
#                would retire this row automatically, or an apply-order /
#                compile-time coupling that must be preserved.
# status:        DEFENSIBLE       = tested, OR verbatim symptom + justification
#                                   recorded; keep.
#                UNDEFENDED       = no test AND justification UNRECORDED.
#                RETIRE-CANDIDATE = evidence suggests it may already be dead.
#                RETIRE-CONFIRMED = ablation measured green, safe to delete.
#
# ref: cites a recipe/NOTES.md subsection (e.g. "recipe/NOTES.md 1.3") when the
#      prose rationale has been extracted there. Empty means not yet extracted
#      there (it may still exist in ZIG_RECIPE_LLM_REFERENCE.md, which this
#      manifest cites inline in verify/depends_on instead of via `ref`).

