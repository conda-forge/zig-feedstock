# PATCH_MANIFEST.yaml -- tracked under recipe/, ships with the feedstock.
# One row per patch in recipe/recipe.yaml's source.patches list.
#
# SCOPE: rows are normally one-per-patch, but a row may also cover a NON-PATCH
#        complication (a build.sh block, a recipe.yaml construct) when it carries
#        the same retire-or-keep question. Such rows name their location in `file:`
#        and are marked (NOT A PATCH).
#
# symptom:       VERBATIM error text. An empty symptom means nobody can retire this row.
# tested_by:    a test in the recipe that exercises this patch. A tested patch is DEFENDED:
#               the test is the symptom encoded executably and re-checks every lane.
# justification: EXTERNAL-CONDITION = a checkable state of the world (retirable by reading).
#                OBSERVED-FAILURE   = a crash we saw (retirable only by ablation).
#                UNRECORDED         = neither. Unfalsifiable until ablated.
# verify:        the check that would show this patch is no longer needed.
# depends_on:   another ablation unit whose retirement would retire this row automatically.
# status:        DEFENSIBLE       = verbatim symptom recorded, keep.
#                UNDEFENDED       = no WHY in patch file AND none in reference doc.
#                RETIRE-CANDIDATE = evidence suggests it may already be dead.
#                RETIRE-CONFIRMED = ablation measured green, safe to delete.
#
# ref: cites a recipe/NOTES.md subsection (e.g. "recipe/NOTES.md 1.3") when the
#      prose rationale has been extracted there. Empty means not yet extracted.

