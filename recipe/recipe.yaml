schema_version: 1

context:
  build_number: 1
  name: zig
  version: "0.17.0"
  abi_version: ${{ (version | split("."))[:2] | join(".") }}
  snapshot: "1933+e19a73c2d"
  # Bootstrap comes from an ALREADY-PUBLISHED snapshot's zig_impl; self-hosting round.
  snapshot_ref: "1933"
  build_ref: "0"
  zig_impl_pin: '[version="${{ abi_version }}.*", build="*_${{ snapshot_ref }}_*", build_number=">=${{ build_ref }}"]'

  llvm_src_version: "22.1.6"
  llvm_version: ${{ llvm_src_version | split(".") | first }}

  bootstrap_via_upstream: false

  # runs-on (cross-compiled) and generates-code-for (cross-compilers)
  xc_l64:        ${{ cross_target_platform_ == "linux-64" }}
  xc_aarch64:    ${{ cross_target_platform_ == "linux-aarch64" }}
  xc_ppc64le:    ${{ cross_target_platform_ == "linux-ppc64le" }}
  xc_riscv64:    ${{ cross_target_platform_ == "linux-riscv64" }}
  xc_s390x:      ${{ cross_target_platform_ == "linux-s390x" }}
  xc_o64:        ${{ cross_target_platform_ == "osx-64" }}
  xc_oarm64:     ${{ cross_target_platform_ == "osx-arm64" }}
  xc_w64:        ${{ cross_target_platform_ == "win-64" }}
  xc_warm64:     ${{ cross_target_platform_ == "win-arm64" }}
  xc_win32:      ${{ cross_target_platform_ == "win-32" }}

  xc_lnx:        ${{ "linux" in cross_target_platform_ and "linux" in build_platform }}
  xc_osx:        ${{ "osx"   in cross_target_platform_ and "osx"   in build_platform }}
  xc_nlo:        ${{ "win"   in cross_target_platform_ and "win"   in build_platform }}

  xc_host_valid: ${{ target_platform not in ['linux-ppc64le', 'linux-riscv64', 'linux-s390x', 'win-arm64', 'win-32'] }}
  xc_valid:      ${{ (xc_lnx or xc_osx or xc_nlo) and xc_host_valid }}

  # Silly shortcuts
  exe: ${{ ".exe" if not unix else "" }}
  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ ".bat" if not unix else ".sh" }}

  # Zig target mapping https://github.com/ziglang/zig-bootstrap
  _c_v: ${{ c_stdlib_version | default("") }}
  zig_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ _c_v        if xc_l64                              else
      "aarch64-linux-gnu." ~ _c_v       if xc_aarch64                          else
      "powerpc64le-linux-gnu." ~ _c_v   if xc_ppc64le                          else
      "riscv64-linux-gnu." ~ _c_v       if xc_riscv64                          else
      "s390x-linux-gnu." ~ _c_v         if xc_s390x                            else
      "x86_64-macos." ~ _c_v ~ "-none"  if xc_o64                              else
      "aarch64-macos." ~ _c_v ~ "-none" if xc_oarm64                           else
      "x86_64-windows-msvc"             if xc_w64                              else
      "aarch64-windows-msvc"            if xc_warm64                           else
      "x86-windows-msvc"                if xc_win32                            else
      "native"
    }}
  zig_short_triplet: ${{ zig_triplet | split(".") | first }}

  # Known conda-forge build_platforms (zig -target format, no glibc suffix)
  zig_build_triplet: >-
    ${{
      "x86_64-linux-gnu"                if build_platform == "linux-64"        else
      "aarch64-linux-gnu"               if build_platform == "linux-aarch64"   else
      "x86_64-macos." ~ _c_v            if build_platform == "osx-64"          else
      "aarch64-macos." ~ _c_v           if build_platform == "osx-arm64"       else
      "x86_64-windows-gnu"              if build_platform == "win-64"          else
      "native"
    }}

  # Conda-style triplet for binary prefixes (e.g., x86_64-conda-linux-gnu-zig)
  conda_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"          if xc_l64                              else
      "aarch64-conda-linux-gnu"         if xc_aarch64                          else
      "powerpc64le-conda-linux-gnu"     if xc_ppc64le                          else
      "riscv64-conda-linux-gnu"         if xc_riscv64                          else
      "s390x-conda-linux-gnu"           if xc_s390x                            else
      "x86_64-apple-darwin13.4.0"       if xc_o64                              else
      "arm64-apple-darwin20.0.0"        if xc_oarm64                           else
      "x86_64-w64-mingw32"              if xc_w64                              else
      "aarch64-w64-mingw32"             if xc_warm64                           else
      "i686-w64-mingw32"                if xc_win32                            else
      "unknown_conda_triplet"
    }}

  # Build mode detection helpers
  build_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"          if build_platform == "linux-64"        else
      "aarch64-conda-linux-gnu"         if build_platform == "linux-aarch64"   else
      "x86_64-apple-darwin13.4.0"       if build_platform == "osx-64"          else
      "arm64-apple-darwin20.0.0"        if build_platform == "osx-arm64"       else
      "x86_64-w64-mingw32"              if build_platform == "win-64"          else
      "unknown_build_triplet"
    }}

  # Same mapping as build_triplet but keyed on target_platform.
  # Used by xc_build_triplet for unhosted cross-compilers (runs on target_platform).
  target_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"          if target_platform == "linux-64"       else
      "aarch64-conda-linux-gnu"         if target_platform == "linux-aarch64"  else
      "powerpc64le-conda-linux-gnu"     if target_platform == "linux-ppc64le"  else
      "riscv64-conda-linux-gnu"         if target_platform == "linux-riscv64"  else
      "s390x-conda-linux-gnu"           if target_platform == "linux-s390x"    else
      "x86_64-apple-darwin13.4.0"       if target_platform == "osx-64"         else
      "arm64-apple-darwin20.0.0"        if target_platform == "osx-arm64"      else
      "x86_64-w64-mingw32"              if target_platform == "win-64"         else
      "aarch64-w64-mingw32"             if target_platform == "win-arm64"      else
      "i686-w64-mingw32"                if target_platform == "win-32"         else
      "unknown_target_triplet"
    }}

  # Same mapping as zig_build_triplet but keyed on target_platform (zig -target format).
  # Used by xc_build_zig_triplet for unhosted cross-compilers (runs on target_platform).
  zig_target_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ _c_v        if target_platform == "linux-64"       else
      "aarch64-linux-gnu." ~ _c_v       if target_platform == "linux-aarch64"  else
      "powerpc64le-linux-gnu." ~ _c_v   if target_platform == "linux-ppc64le"  else
      "riscv64-linux-gnu." ~ _c_v       if target_platform == "linux-riscv64"  else
      "s390x-linux-gnu." ~ _c_v         if target_platform == "linux-s390x"    else
      "x86_64-macos." ~ _c_v ~ "-none"  if target_platform == "osx-64"         else
      "aarch64-macos." ~ _c_v ~ "-none" if target_platform == "osx-arm64"      else
      "x86_64-windows-gnu"              if target_platform == "win-64"         else
      "aarch64-windows-gnu"             if target_platform == "win-arm64"      else
      "x86-windows-gnu"                 if target_platform == "win-32"         else
      "native"
    }}

  qemu_arch: ${{ target_platform | replace("linux-64", "x86_64") | replace("linux-", "") }}
  qemu_pkg: ${{ "qemu-execve-" ~ qemu_arch ~ '[version=">=11", build_number=">=5"]' if linux and build_platform != target_platform else "" }}
  sysroot: ${{ "/" ~ target_triplet ~ "/sysroot" if linux else "" }}

  is_hosted_xcompiler:   ${{ build_platform == target_platform and cross_target_platform_ != target_platform and xc_valid }}
  is_unhosted_xcompiler: ${{ target_platform != build_platform and cross_target_platform_ != target_platform and xc_valid }}
  xc_build_platform: >-
    ${{
      build_platform                    if is_hosted_xcompiler                 else
      target_platform                   if is_unhosted_xcompiler               else
      "unknown_xc_build_platform"
    }}

  xc_build_triplet: ${{ build_triplet if not is_unhosted_xcompiler else target_triplet }}
  xc_build_zig_triplet: ${{ zig_build_triplet if not is_unhosted_xcompiler else zig_target_triplet }}

  is_native: ${{ build_platform == target_platform and cross_target_platform_ == build_platform }}
  is_cross_compiler: ${{ is_hosted_xcompiler or is_unhosted_xcompiler }}
  is_cross_target: ${{ build_platform != target_platform and cross_target_platform_ == target_platform }}

recipe:
  name: zig-package
  version: ${{ version }}

source:
  - url: https://ziglang.org/builds/zig-${{ version }}-dev.${{ snapshot }}.tar.xz
    sha256: 7230ca86124ca8d46e240491e5f1423994c70a731ca9d57c2f29086fa9d6f55c
    patches:
      # All platforms: wire LLD MachO into zig cc pipeline + allow -fuse-ld=lld.
      # macho-lld-support must apply before prefer-shared-libcxx because the
      # latter patches code inside the machoLink function added by the former.
      - patches/Lld.zig-macho-lld-support.patch
      - patches/Lld.zig-prefer-shared-libcxx.patch
      - patches/llvm.zig-lld-ofmt-macho.patch
      - patches/Config.zig-macho-no-auto-lld.patch
      - patches/main.zig-fuse-ld-lld-cc-path.patch
      - patches/build.zig-02-doctest-forward-target.patch
      - patches/build.zig-03-compiler-step-zig-lib-dir.patch
      # order load-bearing: setjmp-s must precede arm64-stubs
      - patches/non_unix/mingw-include-setjmp-s.patch
      - patches/non_unix/mingw-setjmp-no-crtimp.patch
      - patches/non_unix/mingw-arm64-stubs.patch
      - if: linux
        then:
          - patches/linux/llvm.zig-triple-no-glibc-version.patch
          - patches/linux/link.zig-01-ldscript-relpath-and-l-flags.patch
          - patches/linux/link.zig-02-default-allow-so-scripts.patch
          - patches/linux/link.zig-03-ldscript-sysroot-remap.patch
          # Drop when conda-forge linux glibc floor reaches a version that no longer forces libunwind.
          - patches/linux/target.zig-glibc-needs-libunwind.patch
          # Lower ppc64le glibc_min from 2.19 to 2.17: abilists have full 2.17 data;
          # drop when conda-forge ppc64le glibc floor reaches 2.18 or higher.
          - patches/linux/target.zig-ppc64le-glibc-2.17-min.patch
          # Honour -Wl,--no-as-needed for bundled glibc libs (e.g. -lm).
          # Without this patch, zig drops -lm from DT_NEEDED even when the caller
          # explicitly requested --no-as-needed, breaking dlsym(sin) at runtime.
          # Three-part fix: Config.zig flag + main.zig recorder + Lld.zig bracket.
          - patches/linux/Lld.zig-no-unconditional-as-needed-glibc-bundled.patch
          # LLVM backend: downgrade .shr_exact → .shr when safety checks are on.
          # LLVM InstCombine folds shl(lshr_exact(x,N),N) → x, making the runtime
          # back-shift comparison trivially true and silently dropping the panic.
          # Affects all LLVM-backend targets (ppc64le, aarch64, riscv64, …).
          - patches/linux/Sema.zig-shr-exact-safety-downgrade.patch
      # ppc64le patches are gated on `linux` (any linux variant) so the
      # produced linux-64 / linux-aarch64 / linux-riscv64 zig binaries
      # can also `zig cc -target powerpc64le-linux-gnu`.
      - if: linux
        then:
          # Phase 0001: Architecture Support. Only LdScript is required here: its
          # outputFormat() runs on every backend. The 8 self-hosted ELF-linker arch
          # arms (relocation, Elf, Atom, LinkerDefined, ZigObject, synthetic_sections,
          # eh_frame, Thunk) were removed in build 9 after a linux-64 -> linux-ppc64le
          # build + ppc64le tests confirmed they are dead code: 0003-linker-redirect
          # forces the LLD backend (-> gcc/ld) for powerpc64le+elf, so the self-hosted
          # final-link path is never instantiated. See ZIG_PATCH_AUDIT_0.16.0.md.
          - patches/ppc64le/0001-arch-support-LdScript.zig.patch
          # Phase 0002: Build Configuration (LLVM backend, library paths)
          - patches/ppc64le/0002-build-config-build.zig.patch
          # Phase 0003: Linker Redirection (comprehensive GCC linker with full flag translation)
          - patches/ppc64le/0003-linker-redirect-link.zig.patch
          - patches/ppc64le/0003-gcc-linker-comprehensive-Lld.zig.patch
          # Phase 0006: CMake ppc64le lld bundle override.
          # 0005 (mlongcall) removed 2026-08-11: proven no-op against snapshot 1662.
          # Its hunks guard on CMAKE_SYSTEM_PROCESSOR STREQUAL "powerpc64le" but the
          # recipe passes -DCMAKE_SYSTEM_PROCESSOR=ppc64le, so the block never fired
          # (marker zig-0005-debug absent from the PR #138 ppc64le log); its second
          # hunk targeted zig2, which _build.sh no longer builds; and build.sh:100-109
          # already injects -mlongcall via CMAKE_C_FLAGS/CMAKE_CXX_FLAGS regardless.
          - patches/cmake/0006-ppc64le-lld-bundle-CMakeLists.txt.patch
      - if: not unix
        then:
          - patches/non_unix/build.zig-01-maxrss.patch
          - patches/non_unix/build.zig-02-llvm-lib-multipath.patch
          - patches/non_unix/build.zig-03-msvc-crt-dynamic.patch
          - patches/non_unix/CMakeLists.txt-01-correct-LLVM_LIBRARIES.patch
          - patches/non_unix/Lld.zig-remove-ucrt.patch
          - patches/non_unix/Lld.zig-suppress-importeddllmain.patch
          - patches/non_unix/CMakeLists.txt-02-MD-libzigcpp.patch
          - patches/non_unix/floatop.zig-log2-vectors-approx.patch
          - patches/non_unix/mingw-crtexe-no-atexit.patch
          - patches/non_unix/ucrtbase-export-atexit-alias.patch
          - patches/non_unix/selfinfo-windows-arm64-ptrcast-aligncast.patch
          # win-64/arm64: bound zig's mingw __do_global_ctors walk so a malformed
          # flexlink-merged __CTOR_LIST__ (no -1 head / no NULL terminator) cannot
          # run off the end (0xC00000FD STATUS_STACK_OVERFLOW pre-main).
          - patches/non_unix/gccmain-do-global-ctors-guard.patch
    target_directory: zig-source

  - if: bootstrap_via_upstream
    then:
      - if: build_platform == "osx-arm64"
        then:
          - url: https://ziglang.org/builds/zig-aarch64-macos-${{ version }}-dev.${{ snapshot }}.tar.xz
            sha256: 64588edb1a32fdd64e6014d5a21f013a74936e32d7196a1afb48df8d61803419
            target_directory: zig-bootstrap
      - if: build_platform == "osx-64"
        then:
          - url: https://ziglang.org/builds/zig-x86_64-macos-${{ version }}-dev.${{ snapshot }}.tar.xz
            sha256: 310086ac8b177a32f2b6a2f1b1f742db17a0d346841c57255a47c8b696d8ea44
            target_directory: zig-bootstrap
      - if: build_platform == "win-64"
        then:
          - url: https://ziglang.org/builds/zig-x86_64-windows-${{ version }}-dev.${{ snapshot }}.zip
            sha256: 3efc515ab4d6a5f0a39c6defd719214af2af5010e1075f13d1f6186c1c889a31
            target_directory: zig-bootstrap
      - if: build_platform == "linux-64"
        then:
          - url: https://ziglang.org/builds/zig-x86_64-linux-${{ version }}-dev.${{ snapshot }}.tar.xz
            sha256: 122e91695d3dd7a7b640dac7f901a09a900614ef01e936c9f517dae8299b4368
            target_directory: zig-bootstrap
      - if: build_platform == "linux-aarch64"
        then:
          - url: https://ziglang.org/builds/zig-aarch64-linux-${{ version }}-dev.${{ snapshot }}.tar.xz
            sha256: af999865a348703ed7496ff3c4a8a83a4c4a2b50097b19f99eb1f9f7e1791e4a
            target_directory: zig-bootstrap
      - if: build_platform == "linux-ppc64le"
        then:
          - url: https://ziglang.org/builds/zig-powerpc64le-linux-${{ version }}-dev.${{ snapshot }}.tar.xz
            sha256: a952f26b69f37d88f32fcd0a8d7696ca4b8545e701680bc8f75121b009757566
            target_directory: zig-bootstrap

build:
  number: ${{ build_number }}
  # Fold the dev snapshot into the build string so each nightly snapshot of the
  # same "0.17.0" base version is a DISTINCT conda package. version is hardcoded
  # and the variant hash does not depend on `snapshot` (a context var, not a
  # variant), so without this every snapshot would collide at <hash>_<number>.
  # `+` is illegal in a build string, so sanitize it to `_`. Inherited by all
  # outputs (per-key merge); bump_snapshot.py only needs to patch context.snapshot.
  string: ${{ hash }}_${{ snapshot | replace("+", "_") }}_${{ build_number }}

outputs:
  # ==========================================================================
  # IMPLEMENTATION: zig_impl_$cross_target_platform_ (binaries + stdlib ONLY)
  # Contains actual zig compiler binary (triplet-prefixed) and standard library
  # NO activation scripts, NO wrappers - just the implementation
  # ==========================================================================
  - package:
      name: zig_impl_${{ cross_target_platform_ }}
    build:
      skip: not (is_native or is_cross_target)
      dynamic_linking:
        rpath_allowlist:
          - if: osx
            then:
              - "@loader_path/../lib/zig-llvm/lib"
              - "@loader_path/../lib"
        missing_dso_allowlist:
          - if: osx
            then: /usr/lib/libSystem.B.dylib
          - if: not unix
            then: "*/VERSION.dll"
      script:
        file: build.sh
        env:
          CONDA_TRIPLET: ${{ conda_triplet }}
          ZIG_TRIPLET: ${{ zig_triplet }}

          CONDA_ZIG_BUILD: ${{ build_triplet ~ "-zig" }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" }}
      python:
        skip_pyc_compilation:
          - lib/zig/lldb/pretty_printers.py
    requirements:
      build:
        # --- Common build deps (all cases) ---
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - ${{ m2 }}bash >=5.2
        - ${{ m2 }}file
        - llvm-tools ${{ llvm_version }}.*
        - cmake >=3.5
        - ninja
        - perl 5.32.*
        - python 3.12.*
        - if: not unix
          then:
            - ${{ m2 }}coreutils
            - ${{ m2 }}findutils
            - ${{ m2 }}gawk
            - ${{ m2 }}which
        # NOTE: libcxx is deliberately NOT listed in the build env on osx.
        # The bootstrap zig_impl (previous release, 0.15.2) was linked against
        # libcxx 20 and pins `libcxx 20.*` as a run dep; pinning libcxx 21.*
        # here would make the build env unsolvable. libcxx 21 is still pulled
        # into the host env below for the new zig to link against.
        - if: (build_platform != target_platform)
          then:
            - llvmdev ${{ llvm_version }}.*  # llvm-config
            - if: linux
              then:
                - ${{ qemu_pkg }}
            - if: osx
              then:
                - libxml2-devel

        # Self-hosting: build zig with zig.
        # build_ref is a MINIMUM: rejects older builds, fails loudly until one is published.
        - if: not bootstrap_via_upstream
          then:
            - 'zig_impl_${{ build_platform }}${{ zig_impl_pin }}'
      host:
        - clangdev ${{ llvm_version }}.*
        - libclang-cpp ${{ llvm_version }}.*
        - llvm ${{ llvm_version }}.*
        - libxml2-devel
        - lld ${{ llvm_version }}.*
        - zlib
        - zstd
        - if: osx
          then:
            - libcxx ${{ llvm_version }}.*
      run:
        - if: ppc64le
          then:
            # We redirect linking to gcc/ld.bfd
            - binutils_impl_${{ target_platform }} >=2.45
            - gcc_impl_${{ target_platform }} >=14.3
        - if: osx
          then:
            - libcxx ${{ llvm_version }}.*
      ignore_run_exports:
        by_name:
          - if: linux
            then:
              - libxml2-16
          - if: not unix
            then:
              - ucrt
              - vc14_runtime
    tests:
      # Package contents verification - impl has triplet-prefixed binary
      - package_contents:
          strict: true
          bin:
            - ${{ conda_triplet }}-zig
          lib:
            - if: ppc64le
              then:
                - zig-lld-bundle
          files:
            # qemu-ppc64le doesn't faithfully emulate traps
            - if: (is_native and not win) or (linux and not xc_ppc64le and not xc_riscv64)
              then:
                - ${{ library }}doc/langref.html
            - ${{ library }}lib/zig/{c,compiler_rt,fuzzer,ubsan_rt}.zig
            - ${{ library }}lib/zig/zig.h
            - ${{ library }}lib/zig/build-web/*
            - ${{ library }}lib/zig/c/*.zig
            - ${{ library }}lib/zig/c/stdlib/*.zig
            - ${{ library }}lib/zig/c/sys/*.zig
            - ${{ library }}lib/zig/compiler/*
            - ${{ library }}lib/zig/compiler_rt/*
            - ${{ library }}lib/zig/docs/*
            - ${{ library }}lib/zig/include/*
            - ${{ library }}lib/zig/init/*
            - ${{ library }}lib/zig/libc/*
            - ${{ library }}lib/zig/libcxx/*
            - ${{ library }}lib/zig/libcxxabi/*
            - ${{ library }}lib/zig/libunwind/*
            - ${{ library }}lib/zig/libtsan/*
            - ${{ library }}lib/zig/lldb/pretty_printers.py
            - ${{ library }}lib/zig/std/*
            # Post-install tests
            - etc/conda/test-files/zig*
      # Shared libc++ discovery tests (Lld.zig-prefer-shared-libcxx.patch)
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - export PYTHONIOENCODING=utf-8 && python testing/test_libcxx_shared.py ${{ conda_triplet }} ${{ zig_triplet }}
            else:
              - ${{ "export" if unix else "set" }} PYTHONIOENCODING=utf-8 && python testing/test_libcxx_shared.py ${{ conda_triplet }} ${{ zig_triplet }}
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: osx
              then:
                - libcxx
            - if: linux
              then:
                - sysroot_${{ target_platform }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_libcxx_shared.py
      # Regression test: -Wl,--no-as-needed -lm must put libm in DT_NEEDED.
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - python testing/test_dtneeded.py ${{ conda_triplet }} ${{ zig_triplet }}
            else:
              - echo "SKIP DT_NEEDED test (non-linux)"
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - sysroot_${{ target_platform }}
                - binutils_impl_${{ target_platform }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_dtneeded.py
      # Functional test using triplet-prefixed binary
      - script:
          - if: linux or is_native
            then:
              - if: unix
                then:
                  - export ZIG_GLOBAL_CACHE_DIR="${HOME:-${TMPDIR:-/tmp}}/.local/share/zig/zig-cache"
                else:
                  - set ZIG_GLOBAL_CACHE_DIR=%TEMP%\zig-cache
              - if: linux
                then:
                  - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                  - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                  - if: build_platform != target_platform
                    then:
                      - '[ -n "${QEMU_EXECVE}" ] || { echo "QEMU_EXECVE_MISSING: qemu-execve-${{ qemu_arch }} not found for ${{ target_platform }}"; exit 1; }'
              - if: unix
                then:
                  - _qrun=(); [ -n "${QEMU_EXECVE:-}" ] && _qrun=("${QEMU_EXECVE}")
                  - _zigbin="$(command -v ${{ conda_triplet }}-zig || echo "${PREFIX}/bin/${{ conda_triplet }}-zig")"
                  - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" version'
                  - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" zen'
                  - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" init'
                  - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" test zig-source/test/behavior.zig'
                else:
                  - ${{ conda_triplet }}-zig version
                  - ${{ conda_triplet }}-zig zen
                  - ${{ conda_triplet }}-zig init
                  - ${{ conda_triplet }}-zig test zig-source/test/behavior.zig
            else:
              - echo "Skip test on non-emulated archs"
        requirements:
          build:
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - sysroot_${{ target_platform }}
        files:
          source:
            - zig-source/test

      # Verify zig cc compile+run works (MSYS2 UCRT DLL resolution on Windows)
      - script:
          - if: not unix
            then:
              - echo int main(void){return 0;} > %TEMP%\test_run.c
              - ${{ conda_triplet }}-zig cc -mconsole -o %TEMP%\test_run.exe %TEMP%\test_run.c
              - '%TEMP%\test_run.exe'
              - echo PASS zig cc compile+run (UCRT DLL resolution)

      # Verify -fuse-ld=lld patch: zig cc must honor -fuse-ld=lld and pass
      # unrecognized linker args to LLD instead of rejecting them (Linux/ELF + NonUnix/COFF, not macOS/Mach-O).
      - script:
          - if: unix
            then:
              - export ZIG_GLOBAL_CACHE_DIR="${HOME:-${TMPDIR:-/tmp}}/.local/share/zig/zig-cache"
            else:
              - set ZIG_GLOBAL_CACHE_DIR=%TEMP%\zig-cache
          - if: linux and not ppc64le and not arm64
            then:
              # Linux: test with ELF --dynamic-list
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - echo 'int main(void){return 0;}' > /tmp/test_lld.c
              - echo '{ main; };' > /tmp/test_lld.dyn
              - _qrun=(); [ -n "${QEMU_EXECVE:-}" ] && _qrun=("${QEMU_EXECVE}")
              - _zigbin="$(command -v ${{ conda_triplet }}-zig || echo "${PREFIX}/bin/${{ conda_triplet }}-zig")"
              - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" cc -Wno-unused-command-line-argument -fuse-ld=lld -Wl,--dynamic-list=/tmp/test_lld.dyn -o /tmp/test_lld /tmp/test_lld.c'
              - echo "PASS -fuse-ld=lld with --dynamic-list (Linux/ELF)"
          - if: not unix
            then:
              # NonUnix: test with COFF -- verify -fuse-ld=lld compiles+links+runs
              # Running the binary validates MSYS2 UCRT DLL resolution (api-ms-win-crt-*)
              - echo int main(void){return 0;} > %TEMP%\test_lld.c
              - ${{ conda_triplet }}-zig cc -fuse-ld=lld -mconsole -o %TEMP%\test_lld.exe %TEMP%\test_lld.c
              - '%TEMP%\test_lld.exe'
              - echo PASS -fuse-ld=lld compile+link+run (NonUnix/COFF)
          - if: osx and is_native and not arm64
            then:
              # macOS (native x86_64 only): test with Mach-O -exported_symbols_list via LLD.
              # Native osx-arm64 is excluded below -- self-hosted backend panic, see arm64 arm.
              - echo 'int main(void){return 0;}' > /tmp/test_lld.c
              - echo '_main' > /tmp/test_lld.exp
              - ${{ conda_triplet }}-zig cc -fuse-ld=lld -Wl,-exported_symbols_list,/tmp/test_lld.exp -o /tmp/test_lld /tmp/test_lld.c
              - echo "PASS -fuse-ld=lld with -exported_symbols_list (macOS/Mach-O via LLD)"
          - if: osx and is_native and arm64
            then:
              # Native osx-arm64 is the only lane where build_platform == target_platform == host,
              # so zig uses its self-hosted aarch64 backend instead of the LLVM backend used by
              # every other lane (incl. native osx-64). That self-hosted backend panics with
              # "reached unreachable code" (SIGABRT) on this exact `zig cc -fuse-ld=lld
              # -Wl,-exported_symbols_list,...` invocation -- an upstream zig 0.17 self-hosted
              # codegen bug, not an lld or recipe issue. Re-enable once upstream fixes it.
              - echo "Skip -fuse-ld=lld Mach-O test on native osx-arm64 (upstream self-hosted-backend panic)"
          - if: ppc64le and linux
            then:
              # LLD lacks ppc64le relocation support; wrapper guard tested via
              # test_zig_toolchain.py (activation package). Raw binary has no wrapper.
              - echo "Skip -fuse-ld=lld test on ppc64le (no wrapper in zig_impl_)"
        requirements:
          build:
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: build_platform != target_platform
              then:
                - sysroot_${{ target_platform }}

      # Verify x86_64-windows-gnu CRT bootstrap: real mingw32 archives in lib-common
      - script:
          - if: xc_w64
            then:
              - if: unix
                then: python testing/test_mingw_crt.py
              - if: not unix
                then: python testing\test_mingw_crt.py
            else:
              - echo "SKIP x86_64-windows-gnu CRT test (non-Windows target)"
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_mingw_crt.py
        requirements:
          build:
            - python >=3.10

  # ==========================================================================
  # ACTIVATION: zig_$cross_target_platform_ (scripts)
  # Contains activation scripts, depends on zig_impl_$cross_target_platform_
  # NO binaries - just the environment setup
  # ==========================================================================
  - package:
      name: zig_${{ cross_target_platform_ }}
    build:
      skip: not (is_native or is_cross_compiler or is_cross_target)
      script:
        file: install_zig_activation.py
        env:
          ZIG_TRIPLET: ${{ zig_triplet }}
          CONDA_TRIPLET: ${{ conda_triplet }}
          CROSS_COMPILER: ${{ is_cross_compiler }}
          NATIVE_TRIPLET: ${{ xc_build_triplet }}
          NATIVE_ZIG_TRIPLET: ${{ xc_build_zig_triplet }}
          # Zig toolchain identification (independent of gcc TOOLCHAIN)
          # Includes -zig suffix so value is directly usable as binary name
          CONDA_ZIG_BUILD: ${{ xc_build_triplet ~ "-zig" }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" }}

          LLVM_VERSION: ${{ llvm_version }}
    requirements:
      build:
        - ${{ m2 }}bash
        - python 3.12.*
        # Need zig to compile .exe shims on non-Unix (cross-compiler shim)
        - if: is_cross_compiler and not unix
          then:
            - 'zig_impl_${{ xc_build_platform }}${{ zig_impl_pin }}'
        - if: not unix
          then:
            - ${{ compiler('c') }}
            - ${{ stdlib("c") }}
      host:
        - if: not is_cross_compiler
          then:
            - ${{ pin_subpackage("zig_impl_" ~ cross_target_platform_, exact=True) }}
      run:
        # For native/cross-target: depend on zig_impl for same cross_target_platform_ (pin_subpackage works)
        # For cross-compiler: depend on zig_impl for BUILD platform (external package)
        - if: is_cross_compiler
          then:
            - 'zig_impl_${{ xc_build_platform }}${{ zig_impl_pin }}'
          else:
            - ${{ pin_subpackage("zig_impl_" ~ cross_target_platform_, exact=True) }}
        - if: xc_ppc64le
          then:
            # ppc64le patches redirect zig linking to gcc/ld.bfd
            # (LLD lacks PowerPC64 relocation support)
            - binutils_impl_${{ cross_target_platform_ }} >=2.45
            - gcc_impl_${{ cross_target_platform_ }} >=14.3
    tests:
      - package_contents:
          strict: true
          bin:
            - if: is_cross_compiler
              then:
                - ${{ conda_triplet }}-zig
          files:
            - etc/conda/activate.d/zig_activate${{ sh }}
            - etc/conda/deactivate.d/zig_deactivate${{ sh }}

            - ${{ library }}bin/${{ conda_triplet }}-zig-cc${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-cxx${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-ar${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-ranlib${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-asm${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-rc${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-lld${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-windres${{ exe }}
            - if: unix
              then:
                - bin/${{ conda_triplet }}-_zig-cc-common.sh
                - bin/${{ conda_triplet }}-_zig-force-load-common.sh
                - bin/${{ conda_triplet }}-_translate.gen.sh
                - bin/${{ conda_triplet }}-zig-force-load-cc
                - bin/${{ conda_triplet }}-zig-force-load-cxx
            # Native-triplet compiler suite (cross-compiler builds only) —
            # the build machine's own zig-cc/cxx/etc, mirroring the target
            # suite above but keyed on xc_build_triplet instead of conda_triplet.
            - if: is_cross_compiler
              then:
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-cc${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-cxx${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-ar${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-ranlib${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-asm${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-rc${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-lld${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-windres${{ exe }}
            - if: is_cross_compiler and unix
              then:
                - bin/${{ xc_build_triplet }}-_zig-cc-common.sh
                - bin/${{ xc_build_triplet }}-_zig-force-load-common.sh
                - bin/${{ xc_build_triplet }}-_translate.gen.sh
                - bin/${{ xc_build_triplet }}-zig-force-load-cc
                - bin/${{ xc_build_triplet }}-zig-force-load-cxx
            # Post-install tests
            - etc/conda/test-files/zig*
      - script:
          # Verify CONDA_ZIG_BUILD and CONDA_ZIG_HOST are set by activation
          - if: unix
            then:
              - test -n "$CONDA_ZIG_BUILD"
              - test -n "$CONDA_ZIG_HOST"
              - echo "CONDA_ZIG_BUILD=$CONDA_ZIG_BUILD"
              - echo "CONDA_ZIG_HOST=$CONDA_ZIG_HOST"
              - test "$CONDA_ZIG_HOST" = "${{ conda_triplet }}-zig"
            else:
              - if not defined CONDA_ZIG_BUILD exit /b 1
              - if not defined CONDA_ZIG_HOST exit /b 1
              - echo CONDA_ZIG_BUILD=%CONDA_ZIG_BUILD%
              - echo CONDA_ZIG_HOST=%CONDA_ZIG_HOST%
          # Wrapper + functional validation tests (Python, cross-platform)
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}/${{ conda_triplet }}/sysroot"
          - if: unix
            then: PYTHONIOENCODING=utf-8 python testing/test_zig_toolchain.py
          - if: not unix
            then: set PYTHONIOENCODING=utf-8 && python testing/test_zig_toolchain.py
          # Cross-compiler .exe shim test (non-Unix only)
          - if: is_cross_compiler and not unix
            then:
              - set "CONDA_TRIPLET=${{ conda_triplet }}" && testing\test-cross-shim.bat
          # Verify zig cc wrapper silently drops /MANIFEST* flags (Windows only).
          # CMake injects /MANIFEST:NO and /MANIFESTUAC:NO alongside -fuse-ld=lld;
          # the cc wrapper must filter them before forwarding to zig cc.
          - if: not unix
            then:
              - echo void f(void){} > %TEMP%\test_manifest.c
              - ${{ conda_triplet }}-zig-cc -shared -fuse-ld=lld /MANIFEST:NO /MANIFESTUAC:NO -o %TEMP%\test_manifest.dll %TEMP%\test_manifest.c
              - if not exist %TEMP%\test_manifest.dll exit /b 1
              - echo PASS zig cc /MANIFEST* filter
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: ppc64le
              then:
                - bash >=5.2
                - libclang-cpp ${{ llvm_version }}.*
            - if: linux
              then:
                - sysroot_${{ cross_target_platform_ }}
                - binutils_impl_${{ cross_target_platform_ }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test-cross-shim.bat
            - testing/test_zig_toolchain.py
      # Verify <triplet>-zig-windres wrapper: -o flag translation works
      - script:
          - if: xc_w64
            then:
              - if: unix
                then: python testing/test_windres.py
              - if: not unix
                then: python testing\test_windres.py
            else:
              - echo "SKIP windres wrapper test (non-Windows target)"
        files:
          recipe:
            - testing/test_windres.py
        requirements:
          build:
            - python >=3.10
      # Verify <triplet>-zig-cc wrapper: -Wl,-eSYM to -Wl,/ENTRY:SYM translation
      - script:
          - if: xc_w64
            then:
              - if: unix
                then: python testing/test_wl_entry_translation.py
              - if: not unix
                then: python testing\test_wl_entry_translation.py
            else:
              - echo "SKIP zig-cc entry point translation test (non-Windows target)"
        files:
          recipe:
            - testing/test_wl_entry_translation.py
        requirements:
          build:
            - python >=3.10
      # Golden/characterization parity tests for the zig-cc wrapper flag
      # translation fragment (recipe/scripts/_zig-cc-common.sh) and its
      # generated C/bash translators (recipe/building/_translate.inc,
      # _translate.gen.sh). Target-independent: internally exercises both
      # unix and windows profiles via subprocess/bash-source-capture, so it
      # is NOT gated on xc_w64 and runs once per build.
      - script:
          - if: unix
            then: python testing/test_flag_translation_parity.py
          - if: not unix
            then: python testing\test_flag_translation_parity.py
          # Drift guard: the committed generated translators
          # (_translate.gen.sh / _translate.inc) must stay in sync with the
          # flag_rules.py manifest they are generated from.
          - if: unix
            then: python building/gen_translators.py --check
          - if: not unix
            then: python building\gen_translators.py --check
        files:
          recipe:
            - testing/test_flag_translation_parity.py
            - testing/_test_utils.py
            - testing/_translate_harness.c
            - scripts/_zig-cc-common.sh
            - building/flag_rules.py
            - building/gen_translators.py
            - building/_translate.gen.sh
            - building/_translate.inc
        requirements:
          build:
            - python >=3.10

  # ==========================================================================
  # METAPACKAGE: zig (native symlinks)
  # Creates unprefixed symlinks: zig -> $TRIPLET-zig
  # Only built when cross_target_platform_ == target_platform
  # ==========================================================================
  - package:
      name: zig
    build:
      skip: cross_target_platform_ != target_platform
      script:
        file: install_zig_symlinks.py
        env:
          CONDA_TRIPLET: ${{ conda_triplet }}
          cross_target_platform_: ${{ cross_target_platform_ }}
    requirements:
      build:
        - python 3.12.*
      host:
        # Host dep ensures targets exist during build for symlink validation
        - ${{ pin_subpackage("zig_" ~ cross_target_platform_, exact=True) }}
      run:
        - ${{ pin_subpackage("zig_" ~ cross_target_platform_, exact=True) }}
      run_exports:
        - ${{ pin_subpackage("zig", upper_bound="x.x.x") }}
    tests:
      - package_contents:
          strict: true
          bin:
            - zig
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
          - if: not arm64
            then:
              - if: unix
                then:
                  - _qrun=(); [ -n "${QEMU_EXECVE:-}" ] && _qrun=("${QEMU_EXECVE}")
                  - _zigbin="$(command -v zig || echo "${PREFIX}/bin/zig")"
                  - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" version'
                else:
                  - zig version
            else:
              - echo "Skip on cross-compiled platform"
        requirements:
          build:
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - sysroot_${{ target_platform }}

  # ==========================================================================
  # TOOLCHAIN META-PACKAGE: zig-compiler (toolchain metapackage)
  # Bundles zig with C toolchain for full development environment
  # ==========================================================================
  - package:
      name: zig-compiler
    build:
      skip: cross_target_platform_ != target_platform
      script: echo "zig-compiler metapackage"
    requirements:
      run:
        - ${{ pin_subpackage("zig", exact=True) }}
        - c-compiler
        - if: linux
          then:
            - binutils_impl_${{ target_platform }}
        - if: osx
          then:
            - lld
            - llvm-tools
    tests:
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
          - if: unix
            then:
              - _qrun=(); [ -n "${QEMU_EXECVE:-}" ] && _qrun=("${QEMU_EXECVE}")
              - _zigbin="$(command -v zig || echo "${PREFIX}/bin/zig")"
              - '"${_qrun[@]+"${_qrun[@]}"}" "${_zigbin}" cc --version'
            else:
              - zig cc --version
        requirements:
          build:
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - sysroot_${{ target_platform }}

about:
  homepage: https://ziglang.org/
  license: MIT AND LicenseRef-Public-Domain
  license_file:
    - zig-source/LICENSE
    - building/mingw-defs/DISCLAIMER.PD
  summary: Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
  description: |
    Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
    Robust: Behavior is correct even for edge cases such as out of memory.
    Optimal: Write programs the best way they can behave and perform.
    Reusable: The same code works in many environments which have different constraints.
    Maintainable: Precisely communicate intent to the compiler and other programmers.
      The language imposes a low overhead to reading code and is resilient to changing requirements and environments.
  documentation: https://ziglang.org/documentation/${{ version }}/
  repository: https://github.com/ziglang/zig

extra:
  recipe-maintainers:
    - MementoRC
    - xmnlab
    - tdejager
  feedstock_name: zig
