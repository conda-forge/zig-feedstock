schema_version: 1

context:
  build_number: 17
  name: zig
  version: "0.16.0"
  abi_version: ${{ (version | split("."))[:2] | join(".") }}
  
  # This can change with upstream versions (although not too likely)
  zig_glibc: ${{ "2.27" if cross_target_platform_ == "linux-riscv64" else c_stdlib_version | default("2.17") }}
  zig_glibc_tgt: ${{ "2.27" if target_platform == "linux-riscv64" else c_stdlib_version | default("2.17") }}

  llvm_src_version: "21.1.8"
  llvm_version: ${{ llvm_src_version | split(".") | first }}

  bootstrap_native_rebuild: ${{ env.get("ZIG_BOOTSTRAP_NATIVE_REBUILD", default="0") == "1" or ppc64le }}  # TEMP revert 'or ppc64le' on build 18
  bootstrap_via_upstream: false
  ci_focus_skip: false
  is_testable: >-
    ${{
      not (build_platform in ["osx-64", "win-64"] and target_platform in ["osx-arm64", "win-32", "win-arm64"]) and
      not (build_platform in ["win-arm64"] and target_platform in ["win-32", "win-64"])
    }}
  skip_langref: ${{ env.get("SKIP_LANGREF", default="1") == "1" or ppc64le or riscv64 or not is_testable }}  # TEMP PR 176: default 1 + riscv64, revert both before merge
  skip_long_test: ${{ env.get("SKIP_LONG_TEST", default="1") == "1" or not is_testable }}  # TEMP PR 176 fast CI, revert before merge

  # runs-on (cross-compiled) and generates-code-for (cross-compilers)
  xc_l64:        ${{ cross_target_platform_ == "linux-64" }}
  xc_aarch64:    ${{ cross_target_platform_ == "linux-aarch64" }}
  xc_ppc64le:    ${{ cross_target_platform_ == "linux-ppc64le" }}
  xc_riscv64:    ${{ cross_target_platform_ == "linux-riscv64" }}
  xc_s390x:      ${{ cross_target_platform_ == "linux-s390x" }}
  xc_o64:        ${{ cross_target_platform_ == "osx-64" }}
  xc_oarm64:     ${{ cross_target_platform_ == "osx-arm64" }}
  xc_w64:        ${{ cross_target_platform_ == "win-64" }}
  xc_warm64:     ${{ cross_target_platform_ == "win-arm64" }}
  xc_win32:      ${{ cross_target_platform_ == "win-32" }}

  xc_lnx:        ${{ "linux" in cross_target_platform_ and "linux" in build_platform }}
  xc_osx:        ${{ "osx"   in cross_target_platform_ and "osx"   in build_platform }}
  xc_nlo:        ${{ "win"   in cross_target_platform_ and "win"   in build_platform }}

  xc_host_valid: ${{ target_platform not in ['linux-ppc64le', 'linux-riscv64', 'linux-s390x', 'win-arm64', 'win-32'] }}
  xc_valid:      ${{ (xc_lnx or xc_osx or xc_nlo) and xc_host_valid }}

  exe:           ${{ ".exe" if not unix else "" }}
  library:       ${{ "Library/" if not unix else "" }}
  m2:            ${{ "m2-" if not unix else "" }}
  sh:            ${{ ".bat" if not unix else ".sh" }}

  # Zig target mapping https://github.com/ziglang/zig-bootstrap
  zig_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ zig_glibc          if xc_l64                              else
      "aarch64-linux-gnu." ~ zig_glibc         if xc_aarch64                          else
      "powerpc64le-linux-gnu." ~ zig_glibc     if xc_ppc64le                          else
      "riscv64-linux-gnu." ~ zig_glibc         if xc_riscv64                          else
      "s390x-linux-gnu." ~ zig_glibc           if xc_s390x                            else
      "x86_64-macos." ~ zig_glibc ~ "-none"    if xc_o64                              else
      "aarch64-macos." ~ zig_glibc ~ "-none"   if xc_oarm64                           else
      "x86_64-windows-msvc"                    if xc_w64                              else
      "aarch64-windows-msvc"                   if xc_warm64                           else
      "x86-windows-msvc"                       if xc_win32                            else
      "native"
    }}

  # Known conda-forge build_platforms (zig -target format, no glibc suffix)
  _c_v: ${{ c_stdlib_version | default("") }}
  zig_build_triplet: >-
    ${{
      "x86_64-linux-gnu"                       if build_platform == "linux-64"        else
      "aarch64-linux-gnu"                      if build_platform == "linux-aarch64"   else
      "x86_64-macos." ~ _c_v                   if build_platform == "osx-64"          else
      "aarch64-macos." ~ _c_v                  if build_platform == "osx-arm64"       else
      "x86_64-windows-gnu"                     if build_platform == "win-64"          else
      "native"
    }}

  # Conda-style triplet for binary prefixes (e.g., x86_64-conda-linux-gnu-zig)
  conda_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"                 if xc_l64                              else
      "aarch64-conda-linux-gnu"                if xc_aarch64                          else
      "powerpc64le-conda-linux-gnu"            if xc_ppc64le                          else
      "riscv64-conda-linux-gnu"                if xc_riscv64                          else
      "s390x-conda-linux-gnu"                  if xc_s390x                            else
      "x86_64-apple-darwin13.4.0"              if xc_o64                              else
      "arm64-apple-darwin20.0.0"               if xc_oarm64                           else
      "x86_64-w64-mingw32"                     if xc_w64                              else
      "aarch64-w64-mingw32"                    if xc_warm64                           else
      "i686-w64-mingw32"                       if xc_win32                            else
      "unknown_conda_triplet"
    }}

  build_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"                 if build_platform == "linux-64"        else
      "aarch64-conda-linux-gnu"                if build_platform == "linux-aarch64"   else
      "x86_64-apple-darwin13.4.0"              if build_platform == "osx-64"          else
      "arm64-apple-darwin20.0.0"               if build_platform == "osx-arm64"       else
      "x86_64-w64-mingw32"                     if build_platform == "win-64"          else
      "unknown_build_triplet"
    }}

  # target_triplet mapping (mirrors build_triplet). See recipe/NOTES.md 2.1.
  target_triplet: >-
    ${{
      "x86_64-conda-linux-gnu"                 if target_platform == "linux-64"       else
      "aarch64-conda-linux-gnu"                if target_platform == "linux-aarch64"  else
      "powerpc64le-conda-linux-gnu"            if target_platform == "linux-ppc64le"  else
      "riscv64-conda-linux-gnu"                if target_platform == "linux-riscv64"  else
      "s390x-conda-linux-gnu"                  if target_platform == "linux-s390x"    else
      "x86_64-apple-darwin13.4.0"              if target_platform == "osx-64"         else
      "arm64-apple-darwin20.0.0"               if target_platform == "osx-arm64"      else
      "x86_64-w64-mingw32"                     if target_platform == "win-64"         else
      "aarch64-w64-mingw32"                    if target_platform == "win-arm64"      else
      "i686-w64-mingw32"                       if target_platform == "win-32"         else
      "unknown_target_triplet"
    }}

  # zig_target_triplet mapping (mirrors zig_build_triplet). See recipe/NOTES.md 2.1.
  zig_target_triplet: >-
    ${{
      "x86_64-linux-gnu." ~ zig_glibc_tgt      if target_platform == "linux-64"       else
      "aarch64-linux-gnu." ~ zig_glibc_tgt     if target_platform == "linux-aarch64"  else
      "powerpc64le-linux-gnu." ~ zig_glibc_tgt if target_platform == "linux-ppc64le"  else
      "riscv64-linux-gnu." ~ zig_glibc_tgt     if target_platform == "linux-riscv64"  else
      "s390x-linux-gnu." ~ zig_glibc_tgt       if target_platform == "linux-s390x"    else
      "x86_64-macos." ~ _c_v ~ "-none"         if target_platform == "osx-64"         else
      "aarch64-macos." ~ _c_v ~ "-none"        if target_platform == "osx-arm64"      else
      "x86_64-windows-gnu"                     if target_platform == "win-64"         else
      "aarch64-windows-gnu"                    if target_platform == "win-arm64"      else
      "x86-windows-gnu"                        if target_platform == "win-32"         else
      "native"
    }}

  qemu_arch: ${{ target_platform | replace("linux-64", "x86_64") | replace("linux-", "") }}
  qemu_pkg: ${{ "qemu-execve-" ~ qemu_arch ~ '[version=">=11", build_number=">=10"]' if linux and build_platform != target_platform else "" }}
  sysroot: ${{ "/" ~ target_triplet ~ "/sysroot" if linux else "" }}

  is_hosted_xcompiler:   ${{ build_platform == target_platform and cross_target_platform_ != target_platform and xc_valid }}
  is_unhosted_xcompiler: ${{ target_platform != build_platform and cross_target_platform_ != target_platform and xc_valid }}
  xc_build_platform: >-
    ${{
      build_platform                           if is_hosted_xcompiler                 else
      target_platform                          if is_unhosted_xcompiler               else
      "unknown_xc_build_platform"
    }}

  xc_build_triplet: ${{ build_triplet if not is_unhosted_xcompiler else target_triplet }}
  xc_build_zig_triplet: ${{ zig_build_triplet if not is_unhosted_xcompiler else zig_target_triplet }}

  is_native: ${{ build_platform == target_platform and cross_target_platform_ == build_platform }}
  is_cross_compiler: ${{ is_hosted_xcompiler or is_unhosted_xcompiler }}
  is_cross_target: ${{ build_platform != target_platform and cross_target_platform_ == target_platform }}

  shim_runs_on_target: ${{ target_platform != build_platform }}

recipe:
  name: zig-package
  version: ${{ version }}

source:
  - url: https://ziglang.org/download/${{ version }}/zig-${{ version }}.tar.xz
    sha256: 43186959edc87d5c7a1be7b7d2a25efffd22ce5807c7af99067f86f99641bfdf
    patches:
      # macho-lld-support must precede prefer-shared-libcxx. See recipe/NOTES.md 1.1.
      - patches/Lld.zig-macho-lld-support.patch
      - patches/Lld.zig-prefer-shared-libcxx.patch
      - patches/llvm.zig-lld-ofmt-macho.patch
      - patches/Config.zig-macho-no-auto-lld.patch
      - patches/main.zig-fuse-ld-lld-cc-path.patch
      - patches/build.zig-02-doctest-forward-target.patch
      # patch order: setjmp-s before arm64-stubs. See recipe/NOTES.md 1.2.
      - patches/non_unix/mingw-include-setjmp-s.patch
      - patches/non_unix/mingw-arm64-stubs.patch
      - if: linux
        then:
          - patches/build.zig-maxrss.patch
          - patches/linux/llvm.zig-triple-no-glibc-version.patch
          - patches/linux/link.zig-01-ldscript-relpath-and-l-flags.patch
          - patches/linux/link.zig-02-default-allow-so-scripts.patch
          - patches/linux/link.zig-03-ldscript-sysroot-remap.patch
          # Drop when conda-forge linux glibc floor reaches a version that no longer forces libunwind.
          - patches/linux/target.zig-glibc-needs-libunwind.patch
          # ppc64le glibc-2.17-min patch rationale. See recipe/NOTES.md 1.3.
          - patches/linux/target.zig-ppc64le-glibc-2.17-min.patch
          # --no-as-needed glibc-bundled libs fix. See recipe/NOTES.md 1.4.
          - patches/linux/Lld.zig-no-unconditional-as-needed-glibc-bundled.patch
          # shr_exact safety downgrade rationale. See recipe/NOTES.md 1.5.
          - patches/linux/Sema.zig-shr-exact-safety-downgrade.patch
      # ppc64le patches gated on linux (any variant). See recipe/NOTES.md 1.6.
      - if: linux
        then:
          # LdScript arch support; self-hosted arms removed. See recipe/NOTES.md 1.7.
          - patches/ppc64le/LdScript.zig-arch-support.patch
          - patches/ppc64le/build.zig-llvm-lld-config.patch
          - patches/ppc64le/posix.zig-dl-iterate-phdr-no-pt-phdr.patch
      - if: not unix
        then:
          - patches/non_unix/build.zig-01-maxrss.patch
          - patches/non_unix/build.zig-02-llvm-lib-multipath.patch
          - patches/non_unix/build.zig-03-msvc-crt-dynamic.patch
          - patches/non_unix/CMakeLists.txt-01-correct-LLVM_LIBRARIES.patch
          - patches/non_unix/Lld.zig-remove-ucrt.patch
          - patches/non_unix/Lld.zig-suppress-importeddllmain.patch
          - patches/non_unix/CMakeLists.txt-02-MD-libzigcpp.patch
          - patches/non_unix/floatop.zig-log2-vectors-approx.patch
          - patches/non_unix/mingw-crtexe-no-atexit.patch
          - patches/non_unix/ucrtbase-export-atexit-alias.patch
          - patches/non_unix/selfinfo-windows-arm64-ptrcast-aligncast.patch
          # gccmain do_global_ctors guard rationale. See recipe/NOTES.md 1.8.
          - patches/non_unix/gccmain-do-global-ctors-guard.patch
    target_directory: zig-source

  - if: bootstrap_via_upstream
    then:
      - if: build_platform == "osx-arm64"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-aarch64-macos-${{ version }}.tar.xz
            sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            target_directory: zig-bootstrap
      - if: build_platform == "osx-64"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-x86_64-macos-${{ version }}.tar.xz
            sha256: 0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7
            target_directory: zig-bootstrap
      - if: build_platform == "win-64"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-x86_64-windows-${{ version }}.zip
            sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            target_directory: zig-bootstrap
      - if: build_platform == "linux-64"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-x86_64-linux-${{ version }}.tar.xz
            sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            target_directory: zig-bootstrap
      - if: build_platform == "linux-aarch64"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-aarch64-linux-${{ version }}.tar.xz
            sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            target_directory: zig-bootstrap
      - if: build_platform == "linux-ppc64le"
        then:
          - url: https://ziglang.org/download/${{ version }}/zig-powerpc64le-linux-${{ version }}.tar.xz
            sha256: 18800b45c08bf40b335ca5ab79aea70aca287ca969036e938155772becaeebeb
            target_directory: zig-bootstrap

build:
  number: ${{ build_number }}

outputs:
  # zig_impl output: binaries + stdlib only. See recipe/NOTES.md 2.12.
  - package:
      name: zig_impl_${{ cross_target_platform_ }}
    build:
      skip: ci_focus_skip or not (is_native or is_cross_target)
      dynamic_linking:
        rpath_allowlist:
          - if: osx
            then:
              - "@loader_path/../lib"
        missing_dso_allowlist:
          - if: osx
            then: /usr/lib/libSystem.B.dylib
          - if: not unix
            then: "*/VERSION.dll"
          - if: linux
            then:
              - "*/libc.so.6"
              - "*/libm.so.6"
              - "*/libpthread.so.0"
              - "*/librt.so.1"
              - "*/libdl.so.2"
              - "*/libresolv.so.2"
              - "*/libutil.so.1"
              - "*/ld-linux-*.so.*"
              - "*/ld64.so.*"
      script:
        file: build.sh
        env:
          CONDA_TRIPLET: ${{ conda_triplet }}
          ZIG_TRIPLET: ${{ zig_triplet }}

          CONDA_ZIG_BUILD: ${{ build_triplet ~ "-zig" }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" }}

          # ZIG_SYSROOT_MODE values explained. See recipe/NOTES.md 2.2.
          ZIG_SYSROOT_MODE: ${{ env.get("ZIG_SYSROOT_MODE", default="auto") }}

          # Derived from the single skip_langref switch above; do not re-add an env.get here.
          SKIP_LANGREF: ${{ "1" if skip_langref else "0" }}

          DEBUG_ZIG_BUILD: ${{ env.get("DEBUG_ZIG_BUILD", default="0") }}
          ZIG_DIAG: ${{ env.get("ZIG_DIAG", default="1") }}
          ZIG_LANGREF_TIMEOUT: ${{ env.get("ZIG_LANGREF_TIMEOUT", default="5h") }}

          # Operator switch: see bootstrap_native_rebuild above. Off by default.
          ZIG_BOOTSTRAP_NATIVE_REBUILD: ${{ "1" if bootstrap_native_rebuild else "0" }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
        - ${{ m2 }}bash >=5.2
        - ${{ m2 }}file
        - cmake >=3.5
        - llvm-tools ${{ llvm_version }}.*
        - ninja
        - perl 5.32.*
        - python 3.12.*
        - if: not unix
          then:
            - ${{ m2 }}coreutils
            - ${{ m2 }}findutils
            - ${{ m2 }}gawk
            - ${{ m2 }}which
        - if: (build_platform != target_platform)
          then:
            - llvmdev ${{ llvm_version }}.*  # llvm-config
            - if: linux
              then:
                - ${{ qemu_pkg }}
            - if: osx
              then:
                - libxml2-devel

        # Self-hosting: build zig with zig.
        - if: not bootstrap_via_upstream
          then:
            - zig_impl_${{ build_platform }} ${{ abi_version }}.*

        # bootstrap_native_rebuild deps rationale. See recipe/NOTES.md 2.3.
        - if: bootstrap_native_rebuild
          then:
            - clangdev ${{ llvm_version }}.*
            - lld ${{ llvm_version }}.*
            - zlib
            - zstd
            - libxml2-devel
            - binutils_impl_${{ build_platform }} >=2.45
            - gcc_impl_${{ build_platform }} >=14.3
      host:
        - clangdev ${{ llvm_version }}.*
        - libclang-cpp ${{ llvm_version }}.*
        - llvm ${{ llvm_version }}.*
        - libxml2-devel
        - lld ${{ llvm_version }}.*
        - zlib
        - zstd
        - if: osx
          then:
            - libcxx ${{ llvm_version }}.*
      run:
        - if: ppc64le
          then:
            # We redirect linking to gcc/ld.bfd
            - binutils_impl_${{ target_platform }} >=2.45
            - gcc_impl_${{ target_platform }} >=14.3
        - if: osx
          then:
            - libcxx ${{ llvm_version }}.*
      ignore_run_exports:
        by_name:
          - if: linux and not ppc64le
            then:
              - libxml2-16
    tests:
      - package_contents:
          strict: true
          bin:
            - ${{ conda_triplet }}-zig
          files:
            - if: not skip_langref
              then:
                - ${{ library }}doc/langref.html
            - ${{ library }}lib/zig/c.zig
            - ${{ library }}lib/zig/compiler_rt.zig
            - ${{ library }}lib/zig/fuzzer.zig
            - ${{ library }}lib/zig/ubsan_rt.zig
            - ${{ library }}lib/zig/zig.h
            - ${{ library }}lib/zig/build-web/*
            - ${{ library }}lib/zig/c/*.zig
            - ${{ library }}lib/zig/c/stdlib/*.zig
            - ${{ library }}lib/zig/c/sys/*.zig
            - ${{ library }}lib/zig/compiler/*
            - ${{ library }}lib/zig/compiler_rt/*
            - ${{ library }}lib/zig/docs/*
            - ${{ library }}lib/zig/include/*
            - ${{ library }}lib/zig/init/*
            - ${{ library }}lib/zig/libc/*
            - ${{ library }}lib/zig/libcxx/*
            - ${{ library }}lib/zig/libcxxabi/*
            - ${{ library }}lib/zig/libunwind/*
            - ${{ library }}lib/zig/libtsan/*
            - ${{ library }}lib/zig/std/*
            - etc/conda/test-files/zig*

      # Shared libc++ discovery tests (Lld.zig-prefer-shared-libcxx.patch)
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
          - ${{ "export" if unix else "set" }} PYTHONIOENCODING=utf-8 && python testing/test_libcxx_shared.py ${{ conda_triplet }} ${{ zig_triplet }}
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: osx
              then:
                - libcxx
            - if: linux and build_platform != target_platform
              then:
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if ppc64le else (">=" ~ c_stdlib_version) }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_libcxx_shared.py

      # Regression test: -Wl,--no-as-needed -lm must put libm in DT_NEEDED.
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
              - python testing/test_dtneeded.py ${{ conda_triplet }} ${{ zig_triplet }}
            else:
              - echo "SKIP DT_NEEDED test (non-linux)"
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - binutils_impl_${{ target_platform }}
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if ppc64le else (">=" ~ c_stdlib_version) }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_dtneeded.py

      # Regression test: dl_iterate_phdr must tolerate a missing PT_PHDR.
      - script:
          - if: linux
            then:
              - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
              - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
              - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
              - python testing/test_dl_iterate_phdr.py ${{ conda_triplet }} ${{ zig_triplet }}
            else:
              - echo "SKIP dl_iterate_phdr PT_PHDR test (non-linux)"
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - binutils_impl_${{ target_platform }}
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if ppc64le else (">=" ~ c_stdlib_version) }}
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_dl_iterate_phdr.py

      # zig simple test.
      - script:
          interpreter: bash
          content:
            - if: is_testable
              then:
                - export ZIG_GLOBAL_CACHE_DIR="${HOME:-${TMPDIR:-/tmp}}/.local/share/zig/zig-cache"
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
                - _zig="${PREFIX}/${{ library }}bin/${{ conda_triplet }}-zig"
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" version
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" zen
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" init
                - if: not skip_long_test
                  then:
                    - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" test --verbose-link zig-source/test/behavior.zig
              else:
                - echo "Not testable on this system"
        requirements:
          build:
            - if: not unix
              then:
                - ${{ m2 }}bash >=5.2
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux
              then:
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if target_platform == "linux-ppc64le" else (">=" ~ c_stdlib_version) }}
        files:
          source:
            - zig-source/test/behavior.zig
            - zig-source/test/behavior/**

      # zig UCRT DLL.
      - script:
          interpreter: bash
          content:
            - if: not unix
              then:
                - t="$(mktemp -d)"
                - trap 'rm -rf "$t"' EXIT
                - printf 'int main(void){return 0;}\n' > "$t/test_run.c"
                - ${{ conda_triplet }}-zig cc -mconsole -o "$t/test_run.exe" "$t/test_run.c"
                - "$t/test_run.exe"
                - echo "PASS zig cc compile+run (UCRT DLL resolution)"
        requirements:
          build:
            - if: not unix
              then:
                - ${{ m2 }}bash >=5.2

      # -fuse-ld=lld pass-through rationale. See recipe/NOTES.md 2.4.
      - script:
          interpreter: bash
          content:
            - export ZIG_GLOBAL_CACHE_DIR="${HOME:-${TMPDIR:-/tmp}}/.local/share/zig/zig-cache"
            - t="$(mktemp -d)"
            - trap 'rm -rf "$t"' EXIT
            - printf 'int main(void){return 0;}\n' > "$t/test_lld.c"
            - if: linux and not ppc64le
              then:
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
                - _zig="${PREFIX}/bin/${{ conda_triplet }}-zig"
                - printf '{ main; };\n' > "$t/test_lld.dyn"
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" cc -Wno-unused-command-line-argument -fuse-ld=lld -Wl,--dynamic-list="$t/test_lld.dyn" -o "$t/test_lld" "$t/test_lld.c"
                - echo "PASS -fuse-ld=lld with --dynamic-list (Linux/ELF)"
            - if: not unix
              then:
                # NonUnix COFF + UCRT DLL note. See recipe/NOTES.md 2.5.
                - ${{ conda_triplet }}-zig cc -fuse-ld=lld -mconsole -o "$t/test_lld.exe" "$t/test_lld.c"
                - "$t/test_lld.exe"
                - echo "PASS -fuse-ld=lld compile+link+run (NonUnix/COFF)"
            - if: osx and is_testable
              then:
                - printf '_main\n' > "$t/test_lld.exp"
                - ${{ conda_triplet }}-zig cc -fuse-ld=lld -Wl,-exported_symbols_list,"$t/test_lld.exp" -o "$t/test_lld" "$t/test_lld.c"
                - echo "PASS -fuse-ld=lld with -exported_symbols_list (macOS/Mach-O via LLD)"
            - if: ppc64le and linux
              then:
                # ppc64le LLD link path note. See recipe/NOTES.md 2.6.
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
                - _zig="${PREFIX}/bin/${{ conda_triplet }}-zig"
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" cc -Wno-unused-command-line-argument -o "$t/test_lld" "$t/test_lld.c"
                - test -f "$t/test_lld"
                - echo "PASS zig cc produced a ppc64le binary"
        requirements:
          build:
            - ${{ m2 }}bash >=5.2
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux and build_platform != target_platform
              then:
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if ppc64le else (">=" ~ c_stdlib_version) }}

      # test_mingw_crt.py coverage split note. See recipe/NOTES.md 2.7.
      - script:
          - if: xc_w64
            then:
              - python testing/test_mingw_crt.py
            else:
              - echo "SKIP x86_64-windows-gnu CRT test (non-Windows target)"
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test_mingw_crt.py
        requirements:
          build:
            - python >=3.10

  # zig_ output: activation scripts only. See recipe/NOTES.md 2.12.
  - package:
      name: zig_${{ cross_target_platform_ }}
    build:
      skip: ci_focus_skip or not (is_native or is_cross_compiler or is_cross_target)
      script:
        file: install_zig_activation.py
        env:
          ZIG_TRIPLET: ${{ zig_triplet }}
          CONDA_TRIPLET: ${{ conda_triplet }}
          CROSS_COMPILER: ${{ is_cross_compiler }}
          SHIM_RUNS_ON_TARGET: ${{ shim_runs_on_target }}
          NATIVE_TRIPLET: ${{ xc_build_triplet }}
          NATIVE_ZIG_TRIPLET: ${{ xc_build_zig_triplet }}

          CONDA_ZIG_BUILD: ${{ build_triplet ~ "-zig" }}
          CONDA_ZIG_HOST: ${{ conda_triplet ~ "-zig" }}
          NEEDS_EMULATION: ${{ linux and build_platform != target_platform }}

          DEBUG_ZIG_BUILD: ${{ env.get("DEBUG_ZIG_BUILD", default="0") }}
          ZIG_DIAG: ${{ env.get("ZIG_DIAG", default="1") }}
          ZIG_LANGREF_TIMEOUT: ${{ env.get("ZIG_LANGREF_TIMEOUT", default="5h") }}
    requirements:
      build:
        - python 3.12.*
        - llvm-tools ${{ llvm_version }}.*  # llvm-objdump asserts CPU baseline
        - if: unix
          then:
            - ${{ stdlib('c') }}
        - if: is_cross_compiler or is_cross_target
          then:
            - zig_impl_${{ build_platform }} ${{ abi_version }}.*
            - if: ppc64le
              then:
                - binutils_impl_${{ cross_target_platform_ }} >=2.45
                - gcc_impl_${{ cross_target_platform_ }} >=14.3
      host:
        - if: not (is_cross_compiler or is_cross_target)
          then:
            - ${{ pin_subpackage("zig_impl_" ~ cross_target_platform_, exact=True) }}
      run:
        # pin_subpackage vs external zig_impl dep. See recipe/NOTES.md 2.8.
        - if: is_cross_compiler
          then:
            - zig_impl_${{ xc_build_platform }} ${{ abi_version }}.*
          else:
            - ${{ pin_subpackage("zig_impl_" ~ cross_target_platform_, exact=True) }}
        - if: xc_ppc64le
          then:
            - binutils_impl_${{ cross_target_platform_ }} >=2.45
            - gcc_impl_${{ cross_target_platform_ }} >=14.3
    tests:
      - package_contents:
          strict: true
          bin:
            - if: is_cross_compiler
              then:
                - ${{ conda_triplet }}-zig
          files:
            - etc/conda/activate.d/zig_activate${{ sh }}
            - etc/conda/deactivate.d/zig_deactivate${{ sh }}

            - ${{ library }}bin/${{ conda_triplet }}-zig-cc${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-cxx${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-ar${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-ranlib${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-asm${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-rc${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-lld${{ exe }}
            - ${{ library }}bin/${{ conda_triplet }}-zig-windres${{ exe }}
            - if: unix
              then:
                # Compiled multiplexer copies, unix-only (no Windows arm).
                - ${{ library }}bin/${{ conda_triplet }}-zig-force-load-cc
                - ${{ library }}bin/${{ conda_triplet }}-zig-force-load-cxx
            # native-triplet compiler suite note. See recipe/NOTES.md 2.9.
            - if: is_cross_compiler
              then:
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-cc${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-cxx${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-ar${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-ranlib${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-asm${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-rc${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-lld${{ exe }}
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-windres${{ exe }}
            - if: is_cross_compiler and unix
              then:
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-force-load-cc
                - ${{ library }}bin/${{ xc_build_triplet }}-zig-force-load-cxx
            - etc/conda/test-files/zig*

      - script:
          interpreter: bash
          content:
            - test -n "$CONDA_ZIG_BUILD"
            - test -n "$CONDA_ZIG_HOST"
            - echo "CONDA_ZIG_BUILD=$CONDA_ZIG_BUILD"
            - echo "CONDA_ZIG_HOST=$CONDA_ZIG_HOST"
            - test "$CONDA_ZIG_HOST" = "${{ conda_triplet }}-zig"
            - if: linux
              then:
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}/${{ conda_triplet }}/sysroot"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
            - export PYTHONIOENCODING=utf-8 && python testing/test_zig_toolchain.py
            - if: not unix
              then:
                - if: is_cross_compiler
                  then:
                    - CONDA_TRIPLET="${{ conda_triplet }}" testing/test-cross-shim.bat
                - t="$(mktemp -d)"
                - trap 'rm -rf "$t"' EXIT
                - printf 'void f(void){}\n' > "$t/test_manifest.c"
                - MSYS2_ARG_CONV_EXCL='/MANIFEST' ${{ conda_triplet }}-zig-cc -shared -fuse-ld=lld /MANIFEST:NO /MANIFESTUAC:NO -o "$t/test_manifest.dll" "$t/test_manifest.c"
                - test -f "$t/test_manifest.dll"
                - echo "PASS zig cc /MANIFEST* filter"
        requirements:
          build:
            - python >=3.10
            - if: build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
            - if: not unix
              then:
                - ${{ m2 }}bash >=5.2
          run:
            - if: (build_platform != target_platform) and linux
              then:
                - ${{ stdlib("c") }}
            - if: linux and is_cross_compiler
              then:
                # On cross-compilers, QEMU_LD_PREFIX needs to resolve against the cross_target_platform_ sysroot.
                - sysroot_${{ cross_target_platform_ }}
            - if: ppc64le
              then:
                - libclang-cpp ${{ llvm_version }}.*
        files:
          recipe:
            - testing/_test_utils.py
            - testing/test-cross-shim.bat
            - testing/test_zig_toolchain.py

      - script:
          - if: xc_w64
            then:
              - python testing/test_windres.py
            else:
              - echo "SKIP windres wrapper test (non-Windows target)"
        files:
          recipe:
            - testing/test_windres.py
        requirements:
          build:
            - python >=3.10

      - script:
          - if: xc_w64
            then:
              - python testing/test_wl_entry_translation.py
            else:
              - echo "SKIP zig-cc entry point translation test (non-Windows target)"
        files:
          recipe:
            - testing/test_wl_entry_translation.py
        requirements:
          build:
            - python >=3.10

      # test_nonunix_shim_target.py rationale. See recipe/NOTES.md 2.10.
      - script:
          - python testing/test_nonunix_shim_target.py
        files:
          recipe:
            - testing/test_nonunix_shim_target.py
            - install_zig_activation.py
            - scripts/activate.bat
            - scripts/deactivate.bat
            - building/zig-cc-nonunix.c
            - building/zig-tool-nonunix.c
            - building/zig-windres-nonunix.c
            - building/cross-zig-shim.c
        requirements:
          build:
            - python >=3.10
      - script:
          - python testing/test_flag_translation_parity.py
          - python building/gen_translators.py --check
        files:
          recipe:
            - testing/test_flag_translation_parity.py
            - testing/_test_utils.py
            - testing/_translate_harness.c
            - building/flag_rules.py
            - building/gen_translators.py
            - building/_translate.gen.sh
            - building/_translate.inc
            # unix shim leg: needs both .c and header. See recipe/NOTES.md 2.11.
            - building/zig-cc-unix.c
            - building/unix_common.h
        requirements:
          build:
            - python >=3.10

  # zig metapackage: unprefixed symlinks, native-only. See recipe/NOTES.md 2.12.
  - package:
      name: zig
    build:
      skip: ci_focus_skip or cross_target_platform_ != target_platform
      script:
        file: install_zig_symlinks.py
        env:
          CONDA_TRIPLET: ${{ conda_triplet }}
    requirements:
      build:
        - python 3.12.*
      host:
        # Host dep ensures targets exist during build for symlink validation
        - ${{ pin_subpackage("zig_" ~ cross_target_platform_, exact=True) }}
      run:
        - ${{ pin_subpackage("zig_" ~ cross_target_platform_, exact=True) }}
      run_exports:
        - ${{ pin_subpackage("zig", upper_bound="x.x.x") }}
    tests:
      - package_contents:
          strict: true
          bin:
            - zig
      - script:
          interpreter: bash
          content:
            - if: is_testable
              then:
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
                - _zig="${PREFIX}"/${{ library }}bin/zig${{ "" if unix else ".bat" }}
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" version
              else:
                - echo "Not testable on this system"
        requirements:
          build:
            - ${{ m2 }}bash >=5.2
            - if: linux and build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux and build_platform != target_platform
              then:
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if target_platform == "linux-ppc64le" else (">=" ~ c_stdlib_version) }}

  # zig-compiler metapackage: zig + C toolchain. See recipe/NOTES.md 2.12.
  - package:
      name: zig-compiler
    build:
      skip: ci_focus_skip or cross_target_platform_ != target_platform
      script: echo "zig-compiler metapackage"
    requirements:
      run:
        - ${{ pin_subpackage("zig", exact=True) }}
        - if: osx
          then:
            - lld ${{ llvm_version }}.*
            - llvm-tools ${{ llvm_version }}.*
    tests:
      - script:
          interpreter: bash
          content:
            - if: is_testable
              then:
                - export QEMU_EXECVE="${QEMU_EXECVE:-$(command -v qemu-execve-${{ qemu_arch }} || true)}"
                - export QEMU_LD_PREFIX="${PREFIX}${{ sysroot }}"
                - export QEMU_EXECVE_NATIVE_PASSTHROUGH=1
                - _zig="${PREFIX}"/${{ library }}bin/zig${{ "" if unix else ".bat" }}
                - ${QEMU_EXECVE:+"${QEMU_EXECVE}"} "${_zig}" cc --version
              else:
                - echo "Not testable on this system"
        requirements:
          build:
            - ${{ m2 }}bash >=5.2
            - if: linux and build_platform != target_platform
              then:
                - ${{ qemu_pkg }}
          run:
            - if: linux and build_platform != target_platform
              then:
                - sysroot_${{ target_platform }} ${{ (c_stdlib_version ~ ".*") if target_platform == "linux-ppc64le" else (">=" ~ c_stdlib_version) }}

about:
  homepage: https://ziglang.org/
  license: MIT AND Apache-2.0 WITH LLVM-exception AND Apache-2.0 AND LGPL-2.1-or-later AND BSD-2-Clause AND BSD-3-Clause AND ZPL-2.1 AND LicenseRef-Public-Domain
  license_file:
    - zig-source/LICENSE
    - building/mingw-defs/DISCLAIMER.PD
    - zig-source/lib/libcxx/LICENSE.[Tt][Xx][Tt]
    - zig-source/lib/libcxxabi/LICENSE.[Tt][Xx][Tt]
    - zig-source/lib/libunwind/LICENSE.[Tt][Xx][Tt]
    - zig-source/lib/libc/glibc/LICENSES
    - zig-source/lib/libc/mingw/COPYING
    - zig-source/lib/libc/musl/COPYRIGHT
    - zig-source/lib/libc/freebsd/COPYRIGHT
    - zig-source/lib/libc/wasi/LICENSE
    - zig-source/lib/libc/wasi/LICENSE-APACHE
    - zig-source/lib/libc/wasi/LICENSE-APACHE-LLVM
    - zig-source/lib/libc/wasi/LICENSE-MIT
    - zig-source/lib/libc/wasi/libc-bottom-half/cloudlibc/LICENSE
    - zig-source/lib/libc/wasi/libc-top-half/musl/COPYRIGHT
    - zig-source/lib/libc/wasi/fts/musl-fts/COPYING
  summary: Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
  description: |
    Zig is a general-purpose programming language and toolchain for maintaining robust, optimal, and reusable software.
    Robust: Behavior is correct even for edge cases such as out of memory.
    Optimal: Write programs the best way they can behave and perform.
    Reusable: The same code works in many environments which have different constraints.
    Maintainable: Precisely communicate intent to the compiler and other programmers.
      The language imposes a low overhead to reading code and is resilient to changing requirements and environments.
  documentation: https://ziglang.org/documentation/${{ version }}/
  repository: https://github.com/ziglang/zig

extra:
  recipe-maintainers:
    - MementoRC
    - xmnlab
    - tdejager
  feedstock-name: zig
