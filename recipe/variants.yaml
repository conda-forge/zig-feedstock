c_stdlib_version:
  - if: linux and not (aarch64 or ppc64le or s390x or x86_64)
    then:
      - 2.39

c_compiler_version:
  - if: osx
    then:
      - "21"
cxx_compiler_version:
  - if: osx
    then:
      - "21"

channel_targets:
  - conda-forge zig_experimental

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-32
  - win-64
  - win-arm64
