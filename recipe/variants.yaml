channel_sources:
  - conda-forge/label/zig_dev,conda-forge
channel_targets:
  - conda-forge zig_dev
  
c_compiler_version:
  - if: osx
    then:
      - 22
cxx_compiler_version:
  - if: osx
    then:
      - 22

xtarget_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-32
  - win-64
  - win-arm64

