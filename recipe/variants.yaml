channel_sources:
  - conda-forge/label/zig_experimental,conda-forge
channel_targets:
  - conda-forge zig_experimental

c_compiler_version:
  - if: osx
    then:
      - "21"
cxx_compiler_version:
  - if: osx
    then:
      - "21"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-32
  - win-64
  - win-arm64
