channel_targets:
  - conda-forge zig_dev
  
c_compiler_version:
  - if: osx
    then:
      - "22"
cxx_compiler_version:
  - if: osx
    then:
      - "22"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.17.0"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-32
  - win-64
  - win-arm64

