bot:
  abi_migration_branches:
    - dev
build_platform:
  linux_ppc64le: linux_aarch64
  linux_riscv64: linux_aarch64
  osx_64: osx_arm64
  # No LLVM linux_s390x: linux_64
  # No LLVM win_32: win_64
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  osx_arm64: default
  linux_aarch64: default
test: all
workflow_settings:
  build_workspace_dir:
    - os: win
      value: "C:/bld"
  free_disk_space: quick
  pagefile_size: 8
